; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]


[env]
framework = arduino
monitor_speed = 115200
;platform = espressif32
;platform = platformio/espressif32@~4.4.0
platform = https://github.com/platformio/platform-espressif32.git
platform_packages =  
	platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.16


board_build.filesystem = littlefs ; spiffs
board = esp32doit-devkit-v1
upload_speed = 460800

;board_build.flash_mode = dout ; let's try slowest dout used in earlier versions

; me-no-dev/AsyncTCP @ ^1.1.1
lib_deps = 	
 	;https://github.com/me-no-dev/AsyncTCP.git#master
	;https://github.com/me-no-dev/ESPAsyncWebServer.git#master
	esp32async/ESPAsyncWebServer @ ^3.7.6
	bblanchon/ArduinoJson@^6.19.1
	arduino-libraries/NTPClient @ ^3.1.0
	https://github.com/emelianov/modbus-esp8266.git#4.1.1
	adafruit/RTClib @ ^2.1.3
	SPI
	tobiasschuerg/ESP8266 Influxdb @ ^3.12.0
	milesburton/DallasTemperature@^3.11.0 ; updated 23.9.2023 from 3.10.0
	paulstoffregen/OneWire@^2.3.7
	marian-craciunescu/ESP32Ping @ ^1.7
	;https://github.com/Olli69/WireGuard-ESP32-Arduino.git ;ciniml/WireGuard-ESP32@^0.1.5

extra_scripts = 
        pre:src/buildscript_versioning.py
		post:src/postbuild.py
;build_flags
; -DESP32 	- support currently only ESP32
; -DHWID='"esp32-generic-6ch"' 	- hardware id, use platformio.ini env specification
; -DCHANNEL_COUNT=6  	- number of channels
; -DCHANNEL_RULES_MAX=5  	- max number of rules per channel
; -DSENSOR_DS18B20_ENABLED		- support for DS18B20 1-wire temperature sensor enabled
; -DONEWIRE_DATA_GPIO=27  		- GPIO number of 1-wire (temperature sensor)
; -DINFLUX_REPORT_ENABLED 		- influx reporting supported
; -DOTA_DOWNLOAD_ENABLED		- firmware update from web site supported

[env:esp32-debug]
board = esp32doit-devkit-v1
build_flags = -Wunused-variable  -DCHIP_FAMILY='"ESP32"' -DHWID='"esp32-generic-6ch"'  -DCHANNEL_COUNT=6  -DONEWIRE_DATA_GPIO=27  -DCHANNEL_RULES_MAX=5   -DINFLUX_REPORT_ENABLED_NOT  -DSENSOR_DS18B20_ENABLED_NOT -DOTA_DOWNLOAD_ENABLED -DARDUINO_SERIAL_EVENT_TASK_STACK_SIZE=3072
;upload_port = /dev/cu.wchusbserial539C0131721 ; computer dependant, change or comment this if needed
;monitor_port = /dev/cu.wchusbserial539C0131721 ; computer dependant, change or comment this if needed
debug_tool = esp-prog
debug_init_break = tbreak setup
debug_build_flags = -O0 -g3
upload_protocol = esptool
;upload_port = /dev/cu.usbserial-14420
;upload_speed = 115200
;monitor_port = /dev/cu.usbserial-14420
debug_speed = 500

[env:esp32-generic-6ch]
board = esp32doit-devkit-v1
build_flags = -Wunused-variable  -DCHIP_FAMILY='"ESP32"' -DHWID='"esp32-generic-6ch"'  -DCHANNEL_COUNT=6  -DONEWIRE_DATA_GPIO=27  -DCHANNEL_RULES_MAX=5   -DINFLUX_REPORT_ENABLED  -DSENSOR_DS18B20_ENABLED -DOTA_DOWNLOAD_ENABLED -DARDUINO_SERIAL_EVENT_TASK_STACK_SIZE=3072
;upload_port = /dev/cu.wchusbserial539C0131721 ; computer dependant, change or comment this if needed
;monitor_port = /dev/cu.wchusbserial539C0131721 ; computer dependant, change or comment this if needed



[env:esp32c3]
board = airm2m_core_esp32c3
build_flags = -Wunused-variable -DCHIP_FAMILY='"ESP32-C3"' -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DHWID='"airm2m_core_esp32c3"'  -DCHANNEL_COUNT=6  -DONEWIRE_DATA_GPIO=27  -DCHANNEL_RULES_MAX=5   -DINFLUX_REPORT_ENABLED  -DSENSOR_DS18B20_ENABLED -DOTA_DOWNLOAD_ENABLED -DARDUINO_SERIAL_EVENT_TASK_STACK_SIZE=3072
board_build.filesystem = littlefs

[env:esp32s3]
; https://www.waveshare.com/wiki/ESP32-S3-DEV-KIT-N8R8
board = esp32-s3-devkitc-1 ; esp32-s3-devkitc-1,  esp32-s3-devkitm-1
; for upload mode: 1) press boot 2) press RST 3) release RST 4) release boot (https://github.com/Xinyuan-LilyGO/LilyGo-T-Relay/blob/main/docs/RELAY_ESP32S3.MD#3%EF%B8%8F%E2%83%A3-tips)
; https://esp32s3.com/getting-started.html
; NOTE: temporarily removed -DRTC_PCF8563_ENABLED 
; oli -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1 , mutta debug ei tullut konsolille
; kun  -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0 , niin esp-debug tuli, muttei Serial
; -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 tuli sekä serial että debug
; -DHWID='"esp32-s3-devkitc-1"'
build_flags = -Wunused-variable -DCHIP_FAMILY='"ESP32-S3"'  -DHWID='"esp32s3"' -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1  -DCHANNEL_COUNT=6  -DONEWIRE_DATA_GPIO=21  -DCHANNEL_RULES_MAX=5   -DHW_SHIFTREG_ENABLED -DINFLUX_REPORT_ENABLED  -DSENSOR_DS18B20_ENABLED -DOTA_DOWNLOAD_ENABLED -DI2CSDA_GPIO=16 -DI2CSCL_GPIO=17 -DRTC_PCF8563_ENABLED -DARDUINO_SERIAL_EVENT_TASK_STACK_SIZE=3072 -DTEST_LEDS_RGB_INIT

upload_speed = 115200
board_build.flash_mode = dio
board_build.partitions = partitions_4M.csv



[env:esp32-hwext-6ch]
; This has an experimental cooling functionality for devices with small case, e.g Shelly Pro 1/2. The functionality not tested for production environmnt
; Shelly Pro 1/2 status leds via shiftreg is not currently implemented
board = esp32doit-devkit-v1
build_flags = -Wunused-variable -DCHIP_FAMILY='"ESP32"' -DHWID='"esp32-hwext-6ch"'  -DCHANNEL_COUNT=6  -DCHANNEL_RULES_MAX=5  -DHW_SHIFTREG_ENABLED -DCOOLINGEXPR_ENABLED   -DOTA_DOWNLOAD_ENABLED -DARDUINO_SERIAL_EVENT_TASK_STACK_SIZE=3072 

